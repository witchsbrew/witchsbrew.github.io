<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Stylized Midnight Hex lunar seer illustration">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090913"/><stop offset=".52" stop-color="#25143f"/><stop offset="1" stop-color="#0b0915"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#fff6d6"/><stop offset=".55" stop-color="#d6b9ef"/><stop offset="1" stop-color="#6c4f9e"/></radialGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8c5b8"/><stop offset="1" stop-color="#bd8e8f"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171122"/><stop offset=".6" stop-color="#080810"/><stop offset="1" stop-color="#34204d"/></linearGradient>
</defs>
<rect width="1200" height="800" rx="42" fill="url(#bg)"/>
<circle cx="880" cy="188" r="120" fill="url(#moon)" opacity=".95"/>
