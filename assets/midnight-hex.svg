<path d="M620 193 q90 65 120 148" fill="none" stroke="#d6b9ef" stroke-width="3"/><circle cx="741" cy="342" r="16" fill="none" stroke="#d6b9ef" stroke-width="4"/><path d="M747 326 q-16 14 0 30" fill="none" stroke="#d6b9ef" stroke-width="4"/>
